version: 2
project_name: starscope-cli

before:
  hooks:
    - go mod tidy
    - go vet ./...

builds:
  - id: starscope-cli
    main: ./cmd/starscope-cli
    binary: starscope-cli
    env:
      - CGO_ENABLED=0
    goos:
      - linux
      - darwin
      - windows
    goarch:
      - amd64
      - arm64
    ldflags:
      - -s -w
      - -X github.com/strscp/cli/internal/cmd.version={{.Version}}
      - -X github.com/strscp/cli/internal/cmd.commit={{.ShortCommit}}
      - -X github.com/strscp/cli/internal/cmd.date={{.Date}}

archives:
  - id: default
    formats: ['tar.gz']
    format_overrides:
      - goos: windows
        formats: ['zip']
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"

checksum:
  name_template: 'checksums.txt'

changelog:
  sort: asc
  filters:
    exclude:
      - '^docs:'
      - '^test:'
      - '^chore:'
